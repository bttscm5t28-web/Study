<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>一 · ONE</title>
<style>
  @font-face { font-family: SerifSC; src: url(fonts/NotoSerifSC-Bold.otf); font-weight: 700; }
  @font-face { font-family: SansSC; src: url(fonts/NotoSansSC-Thin.otf); font-weight: 100; }
  @font-face { font-family: SansSC; src: url(fonts/NotoSansSC-Light.otf); font-weight: 300; }
  @font-face { font-family: SansSC; src: url(fonts/NotoSansSC-Regular.otf); font-weight: 400; }
  @font-face { font-family: SansSC; src: url(fonts/NotoSansSC-Medium.otf); font-weight: 500; }
  @font-face { font-family: SansSC; src: url(fonts/NotoSansSC-Bold.otf); font-weight: 700; }
  @font-face { font-family: SansSC; src: url(fonts/NotoSansSC-Black.otf); font-weight: 900; }
  @font-face { font-family: Inter; src: url(fonts/Inter-Light.ttf); font-weight: 300; }
  @font-face { font-family: Inter; src: url(fonts/Inter-Regular.ttf); font-weight: 400; }
  @font-face { font-family: Inter; src: url(fonts/Inter-Medium.ttf); font-weight: 500; }
  @font-face { font-family: Inter; src: url(fonts/Inter-SemiBold.ttf); font-weight: 600; }
  @font-face { font-family: Inter; src: url(fonts/Inter-Bold.ttf); font-weight: 700; }
  @font-face { font-family: InterDisplay; src: url(fonts/InterDisplay-Light.ttf); font-weight: 300; }
  @font-face { font-family: InterDisplay; src: url(fonts/InterDisplay-Bold.ttf); font-weight: 700; }
  @font-face { font-family: InterDisplay; src: url(fonts/InterDisplay-Black.ttf); font-weight: 900; }
  html, body { margin: 0; background: #EEEAE2; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// =====================================================================
//  一 · ONE —— 一支关于“形”的短片
//  道生一，一生二，二生三，三生万物。
//  所有画面由 render(t) 按时间确定性地绘制；节拍与 music.py 完全一致。
// =====================================================================
const W = 1920, H = 1080, CX = W / 2, CY = H / 2;
const BEAT = 0.5, BAR = 2.0;
const PAPER = '#EEEAE2', INK = '#151515', RED = '#E2432A', BLUE = '#2747A6', YELLOW = '#F1B530', MUTE = '#8C877E';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------------------------------------------------------------- math
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const outExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const inExpo = k => k <= 0 ? 0 : Math.pow(2, 10 * k - 10);
const inOutExpo = k => k <= 0 ? 0 : k >= 1 ? 1 : k < .5 ? Math.pow(2, 20 * k - 10) / 2 : (2 - Math.pow(2, -20 * k + 10)) / 2;
const inOutCubic = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const outCubic = k => 1 - Math.pow(1 - k, 3);
const inCubic = k => k * k * k;
const outBack = (k, s = 1.7) => 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2);
const inBack = (k, s = 1.7) => (s + 1) * k * k * k - s * k * k;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, k) { const A = hex2rgb(a), B = hex2rgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], clamp(k)))).join(',')})`; }

// ---------------------------------------------------------------- rhythm (mirrors music.py)
const KICKS = [];
for (let b = 4; b < 8; b++) { KICKS.push([b * BAR, .7]); KICKS.push([b * BAR + 2 * BEAT, .55]); }
for (let b = 8; b < 14; b++) for (let i = 0; i < 4; i++) KICKS.push([b * BAR + i * BEAT, .9]);
for (const b of [16, 17, 18, 19, 20, 21, 22, 23, 28, 29]) for (let i = 0; i < 4; i++) if (!(b === 23 && i >= 2)) KICKS.push([b * BAR + i * BEAT, 1]);
for (let b = 24; b < 28; b++) KICKS.push([b * BAR, .35]);
KICKS.sort((a, b) => a[0] - b[0]);
const PLUCKS = [2.0];
for (let b = 2; b <= 30; b++) { if (b === 15) continue; for (const s of (b === 30 ? [0] : [0, 3, 6])) PLUCKS.push(b * BAR + s * BEAT / 2); }
function kickPulse(t, decay = 9) {
  let v = 0;
  for (const [tk, g] of KICKS) { if (tk > t) break; v = g * Math.exp(-(t - tk) * decay); }
  return v;
}
function pluckPulse(t, decay = 8) {
  let v = 0;
  for (const tp of PLUCKS) { if (tp > t) break; v = Math.exp(-(t - tp) * decay); }
  return v;
}
// 时间 t 之前、[a,b) 区间内每个节拍的缓动累计
function stepsBetween(t, a, b, step, dur, ease = inOutExpo, filter = null) {
  let s = 0, i = 0;
  for (let tb = a; tb < b - 1e-6; tb += step, i++) {
    if (tb > t) break;
    if (filter && !filter(i)) continue;
    s += ease(prog(t, tb, tb + dur));
  }
  return s;
}

// ---------------------------------------------------------------- drawing primitives
function bg(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function capsule(cx, cy, w, h, c, r = null) {
  ctx.fillStyle = c; ctx.beginPath();
  ctx.roundRect(cx - w / 2, cy - h / 2, w, h, r === null ? Math.min(w, h) / 2 : r);
  ctx.fill();
}
function circle(x, y, r, c) { if (r <= 0) return; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function ring(x, y, r, c, lw = 1.5, a0 = -Math.PI / 2, sweep = Math.PI * 2) {
  if (r <= 0) return; ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(x, y, r, a0, a0 + sweep); ctx.stroke();
}

// 形状变形：圆 / 方 / 三角 都以等面积的极坐标轮廓表示，任意两者之间可平滑过渡
const NPTS = 160;
const SHAPES = (() => {
  const out = [[], [], []];
  const s = Math.sqrt(Math.PI) / 2;                    // 正方形半边长（与单位圆等面积）
  const rin = Math.sqrt(Math.PI / (3 * Math.sqrt(3)));  // 正三角形内切圆半径（等面积）
  const normals = [90, 210, 330].map(d => d * Math.PI / 180);
  for (let i = 0; i < NPTS; i++) {
    const a = -Math.PI / 2 + i / NPTS * Math.PI * 2, dx = Math.cos(a), dy = Math.sin(a);
    out[0].push([dx, dy]);
    const m = Math.max(Math.abs(dx), Math.abs(dy)); out[1].push([dx / m * s, dy / m * s]);
    let d = 0; for (const n of normals) d = Math.max(d, dx * Math.cos(n) + dy * Math.sin(n));
    out[2].push([dx * rin / d, dy * rin / d]);
  }
  return out;
})();
const CIRCLE = 0, SQUARE = 1, TRI = 2;
// type 可以是小数：0→1→2→3(=0) 循环插值
function shape(type, x, y, R, c, rot = 0, sx = 1, sy = 1) {
  if (R <= 0.01) return;
  const t0 = ((Math.floor(type) % 3) + 3) % 3, t1 = (t0 + 1) % 3, k = type - Math.floor(type);
  const A = SHAPES[t0], B = SHAPES[t1], cr = Math.cos(rot), sr = Math.sin(rot);
  ctx.fillStyle = c; ctx.beginPath();
  for (let i = 0; i < NPTS; i++) {
    const px = lerp(A[i][0], B[i][0], k) * R * sx, py = lerp(A[i][1], B[i][1], k) * R * sy;
    const X = x + px * cr - py * sr, Y = y + px * sr + py * cr;
    i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
  }
  ctx.closePath(); ctx.fill();
}

// ---------------------------------------------------------------- typography
function font(o) { return `${o.weight || 400} ${o.size}px ${o.family || 'Inter'}`; }
function text(s, x, y, o) {
  ctx.save();
  ctx.font = font(o); ctx.letterSpacing = (o.ls || 0) + 'px';
  ctx.fillStyle = o.color || INK; ctx.globalAlpha *= (o.alpha ?? 1);
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'alphabetic';
  const dx = (o.align || 'center') === 'center' ? (o.ls || 0) / 2 : (o.align === 'right' ? (o.ls || 0) : 0);
  ctx.fillText(s, x + dx, y);
  ctx.restore();
}
// 逐字从遮罩下方升起，再向上离场
function reveal(s, x, y, o, tIn, tOut, t, stagger = 0.09, dur = 0.8) {
  if (t < tIn) return;
  ctx.save();
  ctx.font = font(o); ctx.letterSpacing = '0px';
  const ls = o.ls || 0, chars = [...s];
  const ws = chars.map(ch => ctx.measureText(ch).width);
  const total = ws.reduce((a, b) => a + b, 0) + ls * (chars.length - 1);
  let cx = o.align === 'left' ? x : o.align === 'right' ? x - total : x - total / 2;
  const top = y - o.size * 1.05, h = o.size * 1.4;
  ctx.beginPath(); ctx.rect(0, top, W, h); ctx.clip();
  ctx.fillStyle = o.color || INK; ctx.textBaseline = 'alphabetic';
  chars.forEach((ch, i) => {
    const pin = outExpo(prog(t, tIn + i * stagger, tIn + i * stagger + dur));
    const pout = tOut ? inExpo(prog(t, tOut + i * stagger * .5, tOut + i * stagger * .5 + .5)) : 0;
    const dy = (1 - pin) * h - pout * h;
    ctx.globalAlpha = (o.alpha ?? 1) * clamp(pin * 1.5) * (1 - pout * .3);
    ctx.fillText(ch, cx, y + dy);
    cx += ws[i] + ls;
  });
  ctx.restore();
}
function fadeText(s, x, y, o, tIn, tOut, t, dur = .6) {
  const a = outCubic(prog(t, tIn, tIn + dur)) * (tOut ? 1 - prog(t, tOut, tOut + .4) : 1);
  if (a <= 0) return;
  text(s, x, y + (1 - outExpo(prog(t, tIn, tIn + dur))) * 14, { ...o, alpha: (o.alpha ?? 1) * a });
}

// ---------------------------------------------------------------- HUD（随底色自动反色）
const CHAPTERS = [
  [0, '01', '道生一', 'ORIGIN'], [8, '02', '一生二', 'DUALITY'], [16, '03', '二生三', 'TRINITY'],
  [24, '04', '三生万物', 'MULTITUDE'], [32, '05', '万物', 'EVERYTHING'], [48, '06', '归一', 'RETURN'],
  [56, '07', '至简', 'SIMPLICITY'],
];
function lumAt(x, y) {
  const d = ctx.getImageData(x, y, 1, 1).data;
  return (0.299 * d[0] + 0.587 * d[1] + 0.114 * d[2]) / 255;
}
function hud(t) {
  const a = outCubic(prog(t, 0.4, 1.6)) * (1 - prog(t, 62.6, 63.6));
  if (a <= 0) return;
  const pick = (x, y) => lumAt(x, y) > 0.55 ? INK : PAPER;
  const cTL = pick(40, 40), cTR = pick(W - 40, 40), cBL = pick(40, H - 40), cBR = pick(W - 40, H - 40);
  ctx.save(); ctx.globalAlpha = a;
  const M = 64, TY = 76, BY = 1018;
  // 左上：片名
  text('ONE', M, TY, { family: 'Inter', weight: 700, size: 15, ls: 5, color: cTL, align: 'left' });
  text('一 生 万 物', M + 74, TY, { family: 'SansSC', weight: 400, size: 13, ls: 4, color: cTL, align: 'left', alpha: .55 });
  // 右上：章节（换章时上下滚动）
  let ci = 0; for (let i = 0; i < CHAPTERS.length; i++) if (t >= CHAPTERS[i][0]) ci = i;
  const ch = CHAPTERS[ci], k = outExpo(prog(t, ch[0], ch[0] + .7));
  ctx.save(); ctx.beginPath(); ctx.rect(W - 700, TY - 22, 700, 30); ctx.clip();
  const drawCh = (c, dy, al) => {
    text(c[3], W - M, TY + dy, { family: 'Inter', weight: 600, size: 13, ls: 4, color: cTR, align: 'right', alpha: al });
    ctx.font = font({ family: 'Inter', weight: 600, size: 13 }); ctx.letterSpacing = '4px';
    const w1 = ctx.measureText(c[3]).width;
    text(c[2], W - M - w1 - 26, TY + dy, { family: 'SansSC', weight: 500, size: 14, ls: 3, color: cTR, align: 'right', alpha: al * .7 });
    ctx.font = font({ family: 'SansSC', weight: 500, size: 14 }); ctx.letterSpacing = '3px';
    const w2 = ctx.measureText(c[2]).width;
    text(c[1] + ' —', W - M - w1 - w2 - 52, TY + dy, { family: 'Inter', weight: 500, size: 13, ls: 2, color: cTR, align: 'right', alpha: al * .55 });
  };
  if (ci > 0 && k < 1) drawCh(CHAPTERS[ci - 1], -30 * k, 1);
  drawCh(ch, 30 * (1 - k), 1);
  ctx.restore();
  // 左下：时间码（等宽逐字排列）
  const fr = Math.floor((t % 1) * 60), ss = Math.floor(t % 60), mm = Math.floor(t / 60);
  const tc = `${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}:${String(fr).padStart(2, '0')}`;
  [...tc].forEach((c, i) => text(c, M + i * 11, BY, { family: 'Inter', weight: 500, size: 14, color: cBL, align: 'left', alpha: c === ':' ? .45 : .85 }));
  // 右下：节拍器
  const beatIdx = Math.floor(t / BEAT) % 4;
  for (let i = 0; i < 4; i++) {
    const x = W - M - (3 - i) * 16 - 8, y = BY - 9;
    ctx.fillStyle = cBR; ctx.strokeStyle = cBR; ctx.lineWidth = 1.2;
    if (i === beatIdx && t > 2) ctx.fillRect(x, y, 8, 8); else ctx.strokeRect(x + .6, y + .6, 6.8, 6.8);
  }
  text('120 BPM', W - M - 76, BY, { family: 'Inter', weight: 500, size: 13, ls: 3, color: cBR, align: 'right', alpha: .7 });
  ctx.restore();
}

// =====================================================================
//  01 道生一  0–8s
// =====================================================================
function s1(t) {
  bg(PAPER);
  // 十字准线从四边汇聚到中心 —— 点，是线的交点
  const a = outExpo(prog(t, 0.3, 1.9)), fade = 1 - prog(t, 2.0, 2.8);
  if (fade > 0) {
    ctx.save(); ctx.globalAlpha = .28 * fade; ctx.fillStyle = INK;
    const L = CX * a, V = CY * a, gap = 26 * outExpo(prog(t, 1.7, 2.2));
    ctx.fillRect(0, CY - .75, Math.max(0, L - gap), 1.5); ctx.fillRect(W - L + gap, CY - .75, Math.max(0, L - gap), 1.5);
    ctx.fillRect(CX - .75, 0, 1.5, Math.max(0, V - gap)); ctx.fillRect(CX - .75, H - V + gap, 1.5, Math.max(0, V - gap));
    ctx.restore();
  }
  // 涟漪：每一次拨弦，一圈细线
  for (const tp of PLUCKS) {
    if (tp > t || tp > 8) break;
    const k = prog(t, tp, tp + (tp === 2 ? 2.4 : 1.7));
    if (k >= 1) continue;
    ctx.save(); ctx.globalAlpha = (1 - k) * (tp === 2 ? .5 : .28);
    ring(CX, CY, 18 + (tp === 2 ? 420 : 220) * outExpo(k), INK, tp === 2 ? 1.5 : 1.2);
    ctx.restore();
  }
  // 红点诞生
  const r = 18 * outBack(prog(t, 2.0, 2.45), 2.4) * (1 + .22 * pluckPulse(t));
  if (t >= 2) circle(CX, CY, r, RED);
  // 文案
  reveal('道生一', CX, 770, { family: 'SerifSC', weight: 700, size: 54, ls: 30, color: INK }, 3.0, 6.6, t, .14);
  fadeText('THE WAY BEGETS ONE', CX, 828, { family: 'Inter', weight: 500, size: 14, ls: 9, color: MUTE }, 3.7, 6.7, t);
}

// =====================================================================
//  02 一生二  8–16s —— 一个点拉成“一”，“一”分成“二”
// =====================================================================
function s2(t) {
  bg(PAPER);
  const kp = kickPulse(t);
  const k1 = inOutExpo(prog(t, 8.0, 8.9));
  const k2 = inOutExpo(prog(t, 10.0, 10.8));
  const k4 = inOutExpo(prog(t, 14.0, 14.8));
  // 交换：第 12、13 秒的底鼓上两笔上下互换
  const sw = stepsBetween(t, 12, 14, 1, .5);
  const swp = sw % 2, swapK = swp <= 1 ? swp : 2 - swp;
  const yTop0 = CY - 90 * k2, yBot0 = CY + 90 * k2;
  let top = { y: lerp(yTop0, yBot0, swapK), w: lerp(1600, 640, k2), h: lerp(10, 22, k2), c: mix(INK, RED, k2), x: CX };
  let bot = { y: lerp(yBot0, yTop0, swapK), w: lerp(1600, 1040, k2), h: lerp(10, 22, k2), c: INK, x: CX };
  if (t < 10) {
    // 点 → 线
    const w = lerp(36, 1600, k1), h = lerp(36, 10, k1);
    capsule(CX, CY, w * (1 + .012 * kp), h, mix(RED, INK, outCubic(prog(t, 8.2, 9.0))));
  } else {
    // “二” → 两个圆，然后公转
    const orb = Math.PI * inOutExpo(prog(t, 15.0, 15.7));
    const pr = [CX + 100 * Math.cos(Math.PI + orb), CY + 100 * Math.sin(Math.PI + orb)];
    const pi = [CX + 100 * Math.cos(orb), CY + 100 * Math.sin(orb)];
    const drawStroke = (s, tx, ty) => {
      const w = lerp(s.w * (1 + .02 * kp), 160, k4), h = lerp(s.h, 160, k4);
      capsule(lerp(s.x, tx, k4), lerp(s.y, ty, k4), w, h, s.c, lerp(4, 80, k4));
    };
    drawStroke(bot, pi[0], pi[1]);
    drawStroke(top, pr[0], pr[1]);
  }
  reveal('一生二', CX, 830, { family: 'SerifSC', weight: 700, size: 54, ls: 30, color: INK }, 10.5, 14.4, t, .14);
  fadeText('ONE BEGETS TWO', CX, 888, { family: 'Inter', weight: 500, size: 14, ls: 9, color: MUTE }, 11.1, 14.5, t);
}

// =====================================================================
//  03 二生三  16–24s —— 康定斯基：蓝圆、红方、黄三角
// =====================================================================
const TRIO = [
  { type: CIRCLE, c: BLUE, x: 560 },
  { type: SQUARE, c: RED, x: CX },
  { type: TRI, c: YELLOW, x: 1360 },
];
function s3(t) {
  bg(PAPER);
  const kp = kickPulse(t);
  const k = inOutExpo(prog(t, 16.0, 16.8));
  const R = 115;
  // 进入：红圆在右(1060)→中心变方；墨圆在左(860)→蓝圆；黄三角从红方中长出
  const st = [
    { x: lerp(860, 560, k), R: lerp(80 / Math.sqrt(Math.PI) * Math.sqrt(Math.PI), R, k), type: 0, c: mix(INK, BLUE, k) },
    { x: lerp(1060, CX, k), R: lerp(80, R, k), type: k, c: RED },
    null,
  ];
  const ky = outBack(prog(t, 16.45, 17.1), 1.5);
  st[2] = { x: lerp(CX, 1360, inOutExpo(prog(t, 16.4, 17.1))), R: R * ky, type: 2, c: YELLOW };
  // 节拍跳动：每拍轮到一个形状
  const band = inOutExpo(prog(t, 20.0, 20.9));
  for (let i = 0; i < 3; i++) {
    const s = st[i];
    let dy = 0, rot = 0;
    for (let tb = 17.5; tb < 20; tb += BEAT) {
      const bi = Math.round((tb - 17.5) / BEAT) % 3;
      if (bi !== i || tb > t) continue;
      const p = prog(t, tb, tb + .42);
      dy -= 46 * Math.sin(Math.PI * p);
      rot += (i === 1 ? Math.PI / 2 : i === 2 ? Math.PI * 2 / 3 : 0) * inOutCubic(p);
    }
    // 展开前三者先统一成方形，再无缝放大成色带
    const km = inOutCubic(prog(t, 19.5, 19.95));
    const ty = i === 0 ? km : i === 1 ? s.type : 2 - km;
    rot *= 1 - km;
    const kb = inOutExpo(prog(t, 20.0 + i * .08, 20.85 + i * .08));
    if (kb > 0) {
      // 形状展开成三条竖向色带
      const bx = i * 640, exit = inOutExpo(prog(t, 23.0 + i * .1, 23.8 + i * .1)) * (i % 2 ? 1 : -1) * H;
      const hs = s.R * Math.sqrt(Math.PI) / 2;
      const x0 = lerp(s.x - hs, bx, kb), x1 = lerp(s.x + hs, bx + 640, kb);
      const y0 = lerp(CY - hs, 0, kb), y1 = lerp(CY + hs, H, kb);
      ctx.save(); ctx.translate(0, exit);
      rect(x0, y0, x1 - x0, y1 - y0, s.c);
      // 色带里的纸色小形状，每拍变形到下一种
      const morph = stepsBetween(t, 21.0, 23.0, BEAT, .34, inOutCubic);
      const r2 = 70 * outBack(prog(t, 20.5 + i * .1, 21.0 + i * .1)) * (1 + .05 * kp);
      shape(i + morph, bx + 320, CY, r2, i === 2 ? INK : PAPER, 0);
      ctx.restore();
    } else {
      shape(ty, s.x, CY + dy, s.R * (1 + .025 * kp), s.c, rot);
    }
  }
  reveal('二生三', CX, 830, { family: 'SerifSC', weight: 700, size: 54, ls: 30, color: INK }, 16.6, 19.4, t, .14);
  fadeText('TWO BEGETS THREE', CX, 888, { family: 'Inter', weight: 500, size: 14, ls: 9, color: MUTE }, 17.2, 19.5, t);
}

// =====================================================================
//  04 三生万物  24–32s —— 网格里的万物，越来越快
// =====================================================================
const GRID = (() => {
  const rnd = mulberry(11), cells = [], cols = 15, rows = 8, cell = 100, x0 = 210, y0 = 140;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    if (c >= 4 && c <= 10 && r >= 3 && r <= 4) continue; // 中间留给文字卡片
    const u = rnd();
    const col = u < .46 ? INK : u < .68 ? RED : u < .86 ? BLUE : YELLOW;
    const x = x0 + c * cell + cell / 2, y = y0 + r * cell + cell / 2;
    cells.push({ c, r, x, y, type: Math.floor(rnd() * 3), col, rot0: Math.floor(rnd() * 4) * Math.PI / 2,
      d: Math.hypot(c - 7, (r - 3.5) * 1.15), j: rnd() });
  }
  return cells;
})();
function s4(t) {
  bg(PAPER);
  const zoom = 1 + .07 * inCubic(prog(t, 28, 31.2)) + .012 * kickPulse(t);
  ctx.save(); ctx.translate(CX, CY); ctx.scale(zoom, zoom); ctx.translate(-CX, -CY);
  for (const g of GRID) {
    const ta = 24.0 + g.d * .075;
    let s = outBack(prog(t, ta, ta + .4), 2);
    // 坍缩：先外后内吸向中心
    const tc = 31.0 + (8 - g.d) * .03, kc = inExpo(prog(t, tc, tc + .55));
    s *= 1 - kc;
    if (s <= 0) continue;
    const grp4 = (g.c + g.r) % 4;
    const rot = g.rot0 + Math.PI / 2 * stepsBetween(t, 25, 28, BEAT, .3, inOutExpo, i => i % 4 === grp4);
    let ty = g.type;
    ty += stepsBetween(t, 28, 30, BEAT / 2, .2, inOutCubic, i => i % 4 === (g.c * 3 + g.r) % 4);
    ty += stepsBetween(t, 30, 31, BEAT / 4, .1, inOutCubic, i => i % 4 === (g.c + g.r * 2) % 4);
    const x = lerp(g.x, CX, kc), y = lerp(g.y, CY, kc);
    shape(ty, x, y, 30 * s, g.col, rot);
  }
  ctx.restore();
  // 中央卡片
  const kw = inOutExpo(prog(t, 25.0, 25.7)) * (1 - inOutExpo(prog(t, 30.6, 31.1)));
  if (kw > 0) {
    rect(CX - 380 * kw, CY - 100, 760 * kw, 200, PAPER);
    ctx.save(); ctx.beginPath(); ctx.rect(CX - 380 * kw, CY - 100, 760 * kw, 200); ctx.clip();
    reveal('三生万物', CX, CY + 22, { family: 'SerifSC', weight: 700, size: 72, ls: 26, color: INK }, 25.3, 30.3, t, .1);
    fadeText('THREE BEGETS ALL THINGS', CX, CY + 72, { family: 'Inter', weight: 500, size: 14, ls: 9, color: MUTE }, 25.9, 30.3, t);
    ctx.restore();
  }
  // 坍缩之后，静默中的一个红点
  const rd = 10 * outBack(prog(t, 31.45, 31.8), 3);
  if (t > 31.45) circle(CX, CY, rd, RED);
}

// =====================================================================
//  05 万物  32–48s —— 八张卡，每小节一切
// =====================================================================
function label(idx, word, color, lt, x = 120) {
  const k = outExpo(prog(lt, .05, .6));
  ctx.save(); ctx.beginPath(); ctx.rect(0, 860, 1000, 140); ctx.clip();
  text(`0${idx} / 08`, x, 896 + (1 - k) * 40, { family: 'Inter', weight: 500, size: 14, ls: 4, color, align: 'left', alpha: .75 });
  text(word, x - 4, 972 + (1 - outExpo(prog(lt, .1, .7))) * 90, { family: 'InterDisplay', weight: 900, size: 72, ls: 4, color, align: 'left' });
  ctx.restore();
}
function giant(ch, x, y, size, color, lt, family = 'SansSC', weight = 900) {
  const k = outExpo(prog(lt, 0, .7));
  ctx.save();
  ctx.translate(x, y); ctx.scale(lerp(1.12, 1, k), lerp(1.12, 1, k));
  text(ch, 0, 0, { family, weight, size, color, base: 'middle', alpha: clamp(k * 2) });
  ctx.restore();
}
const MOND = (() => {
  // 预先生成分割序列：每次切开当前最大的格子（黄金比 / 对半），记录父格索引
  const rnd = mulberry(5);
  const leaves = [{ x: 0, y: 0, w: W, h: H, c: PAPER, lock: false }];
  const splits = [{ t: 0, idx: 0, axis: 'v', cut: 1187, c: RED, lock: true }];
  const apply = sp => {
    const p = leaves[sp.idx]; let ch;
    if (sp.axis === 'v') { ch = { x: p.x + sp.cut, y: p.y, w: p.w - sp.cut, h: p.h }; p.w = sp.cut; }
    else { ch = { x: p.x, y: p.y + sp.cut, w: p.w, h: p.h - sp.cut }; p.h = sp.cut; }
    ch.c = sp.c; ch.lock = sp.lock; leaves.push(ch);
  };
  apply(splits[0]);
  const pal = [PAPER, PAPER, PAPER, BLUE, YELLOW, INK, RED];
  for (let i = 1; i < 15; i++) {
    let bi = -1;
    leaves.forEach((l, j) => { if (!l.lock && (bi < 0 || l.w * l.h > leaves[bi].w * leaves[bi].h)) bi = j; });
    const best = leaves[bi], axis = best.w > best.h ? 'v' : 'h';
    const cut = Math.round((axis === 'v' ? best.w : best.h) * [.382, .5, .618][Math.floor(rnd() * 3)]);
    let c = pal[Math.floor(rnd() * pal.length)];
    if (c === best.c) c = best.c === PAPER ? (rnd() < .5 ? BLUE : YELLOW) : PAPER;
    const area = axis === 'v' ? (best.w - cut) * best.h : best.w * (best.h - cut);
    const sp = { t: i * BEAT / 4, idx: bi, axis, cut, c, lock: area < 60000 };
    splits.push(sp); apply(sp);
  }
  return splits;
})();
function card5(t, lt) {
  bg(INK);
  const leaves = [{ x: 0, y: 0, w: W, h: H, c: PAPER }];
  for (const sp of MOND) {
    const p = sp.t === 0 ? 1 : outExpo(prog(lt, sp.t, sp.t + .22));
    if (p <= 0) break;
    const par = leaves[sp.idx];
    const full = sp.axis === 'v' ? par.w : par.h, cut = lerp(full, sp.cut, p);
    let ch;
    if (sp.axis === 'v') { ch = { x: par.x + cut, y: par.y, w: full - cut, h: par.h }; par.w = cut; }
    else { ch = { x: par.x, y: par.y + cut, w: par.w, h: full - cut }; par.h = cut; }
    ch.c = sp.c; leaves.push(ch);
  }
  const G = 6;
  for (const l of leaves) if (l.w > 2 * G && l.h > 2 * G) rect(l.x + G, l.y + G, l.w - 2 * G, l.h - 2 * G, l.c);
  // 红块里的字
  const kk = outExpo(prog(lt, .25, .9));
  ctx.save(); ctx.beginPath(); ctx.rect(1187 + 6, 0, W - 1187 - 12, H); ctx.clip();
  text('色', 1556, 470 + (1 - kk) * 80, { family: 'SansSC', weight: 900, size: 340, color: PAPER, base: 'middle', alpha: kk });
  ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(1193, 860, 700, 140); ctx.clip();
  text('05 / 08', 1270, 896, { family: 'Inter', weight: 500, size: 14, ls: 4, color: PAPER, align: 'left', alpha: .75 * kk });
  text('COLOR', 1266, 972 + (1 - outExpo(prog(lt, .3, .9))) * 90, { family: 'InterDisplay', weight: 900, size: 72, ls: 4, color: PAPER, align: 'left' });
  ctx.restore();
}
const SIMPLE = (() => {
  const rnd = mulberry(23), out = [];
  const cols = [INK, INK, RED, BLUE, YELLOW, INK];
  for (let i = 0; i < 22; i++) {
    out.push({ x: 200 + rnd() * 940, y: 230 + rnd() * 520, R: 22 + rnd() * 70, type: Math.floor(rnd() * 3), c: cols[Math.floor(rnd() * cols.length)],
      rot: rnd() * Math.PI, out: .25 + (i % 11) * .085 + (i < 11 ? 0 : .04) });
  }
  return out;
})();
function s5(t) {
  const n = Math.min(7, Math.floor((t - 32) / BAR)), lt = t - 32 - n * BAR;
  const kp = kickPulse(t), pump = 1 + .03 * kp;
  if (n === 0) { // 形 FORM
    bg(RED);
    giant('形', 600, 520, 620, PAPER, lt);
    [CIRCLE, SQUARE, TRI].forEach((ty, i) => {
      const s = outBack(prog(lt, i * BEAT, i * BEAT + .4), 2);
      const rot = (ty === SQUARE ? Math.PI / 2 : ty === TRI ? Math.PI * 2 / 3 : 0) * inOutExpo(prog(lt, 1.5, 1.85));
      shape(ty, 1420, 290 + i * 250, 92 * s * pump, INK, rot);
    });
    label(1, 'FORM', PAPER, lt);
  } else if (n === 1) { // 律 RHYTHM
    bg(YELLOW);
    giant('律', 1500, 470, 500, INK, lt);
    for (let i = 0; i < 28; i++) {
      const h1 = (Math.sin(i * 12.9898) * 43758.5453) % 1, hh = Math.abs(h1);
      const p16 = Math.exp(-((t * 8) % 1) * 5);
      const lvl = .16 + .55 * kp * (.55 + .45 * Math.cos(i * .45 - 1)) + .2 * p16 * hh + .1 * Math.sin(t * 7 + i * .7) ** 2;
      const h = 30 + 560 * lvl * outExpo(prog(lt, i * .012, i * .012 + .4));
      rect(120 + i * 38, 820 - h, 22, h, INK);
    }
    label(2, 'RHYTHM', INK, lt);
  } else if (n === 2) { // 衡 BALANCE
    bg(BLUE);
    giant('衡', CX, 290, 300, PAPER, lt);
    const s = outBack(prog(lt, 0, .5), 1.6);
    const bx = CX, by = 790;
    shape(TRI, bx, by, 70 * s, YELLOW);
    const pivotY = by - 70 * 1.555 * s / 2 * 1.0 - 70 * .78 * s * .0;
    const apex = by - 2 * 0.7776 * 70 * s;
    let ang = 0;
    for (let i = 0; i < 4; i++) { const tb = i * BEAT; ang = lerp(ang, (i % 2 ? -1 : 1) * 0.12, outBack(prog(lt, tb, tb + .4), 2.2)); }
    ctx.save(); ctx.translate(bx, apex); ctx.rotate(ang);
    const L = 1100 * outExpo(prog(lt, .05, .55));
    rect(-L / 2, -14, L, 14, PAPER);
    circle(-L / 2 + 80, -14 - 62, 62 * s, RED);
    shape(SQUARE, L / 2 - 80, -14 - 62 * .886, 62 * s, PAPER);
    ctx.restore();
    label(3, 'BALANCE', PAPER, lt);
  } else if (n === 3) { // 空 SPACE
    bg(PAPER);
    for (let i = 0; i < 4; i++) {
      const tb = 38 + i * BEAT; if (tb > t) break;
      const k = prog(t, tb, tb + 1.6); if (k >= 1) continue;
      ctx.save(); ctx.globalAlpha = (1 - k) * .45; ring(CX, CY, 10 + 900 * outExpo(k), INK, 1.4); ctx.restore();
    }
    const sq = 14 * outBack(prog(lt, 0, .3), 3);
    rect(CX - sq / 2, CY - sq / 2, sq, sq, INK);
    fadeText('空', CX, 650, { family: 'SerifSC', weight: 700, size: 34, color: INK }, 38.4, null, t);
    fadeText('SPACE', CX, 700, { family: 'Inter', weight: 600, size: 12, ls: 12, color: MUTE }, 38.6, null, t);
    fadeText('04 / 08', CX, 1018 - 60, { family: 'Inter', weight: 500, size: 12, ls: 4, color: MUTE }, 38.6, null, t);
  } else if (n === 4) { // 色 COLOR
    card5(t, lt);
  } else if (n === 5) { // 动 MOTION
    bg(INK);
    giant('动', 520, 540, 600, PAPER, lt);
    const rows = [[310, RED, 1.0], [540, YELLOW, 1.45], [770, PAPER, .8]];
    const push = stepsBetween(t, 42, 44, BEAT, .35, outExpo);
    rows.forEach(([y, c, sp], i) => {
      const x = -140 + ((lt * 560 * sp + push * 120 * sp + i * 700) % 2240);
      [[-30, 150], [0, 280], [30, 150]].forEach(([dy, len], k) => { // 扁平速度线
        capsule(x - 80 - len / 2 - (k === 1 ? 0 : 30), y + dy, len, 8, c);
      });
      circle(x, y, 50 * pump, c);
    });
    label(6, 'MOTION', PAPER, lt);
  } else if (n === 6) { // 简 SIMPLE
    bg(PAPER);
    for (const s of SIMPLE) {
      const sc = outBack(prog(lt, 0, .3), 2) * (1 - inBack(prog(lt, s.out + .05, s.out + .3)));
      shape(s.type, s.x, s.y, s.R * sc, s.c, s.rot);
    }
    const g = outBack(prog(lt, 1.1, 1.6), 1.8);
    circle(670, 510, 120 * g * pump, RED);
    giant('简', 1480, 500, 440, INK, lt - 1.0, 'SerifSC', 700);
    label(7, 'SIMPLE', INK, lt);
  } else { // 一 ONE
    const wipe = inOutExpo(prog(t, 47.55, 48.0));
    bg(INK);
    if (wipe > 0) circle(CX, CY, 1200 * wipe, PAPER);
    const draw = inOutExpo(prog(lt, 0, .55));
    const k = inOutExpo(prog(t, 47.0, 47.8));
    const w = lerp(1200 * draw, 36, k), h = lerp(40, 36, k);
    const x = lerp(360 + 600 * draw, CX, k);
    capsule(x, CY, w * (1 + .01 * kp * (1 - k)), h, mix(PAPER, RED, k), lerp(5, 18, k));
    ctx.save(); ctx.globalAlpha = 1 - prog(t, 46.9, 47.3);
    label(8, 'ONE', PAPER, lt);
    ctx.restore();
  }
}

// =====================================================================
//  06 归一  48–56s —— 万物回到一个点
// =====================================================================
const PARTS = (() => {
  const rnd = mulberry(99), out = [], pal = [INK, INK, INK, RED, BLUE, YELLOW];
  for (let i = 0; i < 96; i++) {
    const a = rnd() * Math.PI * 2, d = .25 + .75 * Math.sqrt(rnd());
    out.push({ a, d, R: 5 + rnd() * 12, type: Math.floor(rnd() * 3), c: pal[Math.floor(rnd() * pal.length)], spin: (rnd() - .5) * 2, rot: rnd() * 6 });
  }
  out.sort((p, q) => q.d - p.d);
  out.forEach((p, i) => p.back = 51.8 + i * .03);
  return out;
})();
function s6(t) {
  bg(PAPER);
  // 圆相：一笔细线画圆
  const draw = inOutCubic(prog(t, 49.0, 51.2)), shrink = inOutExpo(prog(t, 54.6, 55.6));
  if (draw > 0 && shrink < 1) {
    ctx.save(); ctx.globalAlpha = .55 * (1 - shrink);
    ring(CX, CY, lerp(330, 20, shrink), INK, 1.6, -Math.PI / 2, Math.PI * 2 * draw);
    ctx.restore();
  }
  let absorbed = 0;
  for (const p of PARTS) {
    const burst = outExpo(prog(t, 48.0, 49.4));
    const drift = (t - 48) * .05 * p.spin;
    const kb = inOutCubic(prog(t, p.back, p.back + 1.3));
    if (kb >= 1) { absorbed++; continue; }
    const a = p.a + drift + kb * 1.2 * Math.sign(p.spin || 1);
    const dist = lerp(0, p.d, burst) * (1 - kb);
    const x = CX + Math.cos(a) * dist * 860, y = CY + Math.sin(a) * dist * 330;
    shape(p.type, x, y, p.R * (1 - kb * .7) * outBack(prog(t, 48.0, 48.4)), p.c, p.rot + t * p.spin);
  }
  // 涟漪 + 红点
  for (const tp of PLUCKS) {
    if (tp < 48 || tp > t) continue;
    const k = prog(t, tp, tp + 1.4); if (k >= 1) continue;
    ctx.save(); ctx.globalAlpha = (1 - k) * .22; ring(CX, CY, 18 + 120 * outExpo(k), INK, 1.2); ctx.restore();
  }
  circle(CX, CY, (18 + 8 * absorbed / PARTS.length) * (1 + .18 * pluckPulse(t)), RED);
  reveal('万物归一', CX, 930, { family: 'SerifSC', weight: 700, size: 46, ls: 26, color: INK }, 50.0, 54.0, t, .12);
  fadeText('ALL THINGS RETURN TO ONE', CX, 980, { family: 'Inter', weight: 500, size: 13, ls: 9, color: MUTE }, 50.6, 54.1, t);
}

// =====================================================================
//  07 大道至简  56–66s
// =====================================================================
function s7(t) {
  bg(PAPER);
  const kp = kickPulse(t);
  const grow = outExpo(prog(t, 56.0, 56.9)), back = inOutExpo(prog(t, 59.45, 60.0));
  // 计算标志排版：红点就是 ONE 里的 O
  ctx.font = font({ family: 'InterDisplay', weight: 900, size: 176 }); ctx.letterSpacing = '6px';
  const neW = ctx.measureText("NE").width, Rl = 64, gap = 28;
  const totalW = Rl * 2 + gap + neW, dotX = CX - totalW / 2 + Rl, base = CY + 64;
  const slide = inOutExpo(prog(t, 60.05, 60.75));
  const home = inOutExpo(prog(t, 63.9, 64.7));
  const lx = lerp(CX, dotX, slide * (1 - home));
  if (t < 60) {
    const R = lerp(22, 1250, grow);
    circle(CX, CY, lerp(R, Rl, back), RED);
    const outK = t > 59.2;
    reveal('大道至简', CX, CY + 30, { family: 'SerifSC', weight: 700, size: 112, ls: 44, color: PAPER }, 56.3, 59.2, t, .1);
    fadeText('THE GREATEST TRUTH IS THE SIMPLEST', CX, CY + 112, { family: 'Inter', weight: 500, size: 16, ls: 10, color: PAPER, alpha: .85 }, 57.0, 59.1, t);
    const lw = (60 + 50 * kp) * outExpo(prog(t, 57.3, 57.9)) * (1 - prog(t, 59.0, 59.3));
    if (lw > 0) rect(CX - lw / 2, CY + 160, lw, 2, PAPER);
  } else {
    // 标志
    const fade = 1 - prog(t, 63.4, 64.2);
    if (fade > 0) {
      ctx.save(); ctx.globalAlpha = fade;
      ctx.beginPath(); ctx.rect(lx + Rl * .2, 0, W, H); ctx.clip();
      const nx = lx + Rl + gap;
      text('NE', nx - (1 - slide) * 60, base, { family: 'InterDisplay', weight: 900, size: 176, ls: 6, color: INK, align: 'left' });
      ctx.restore();
      ctx.save(); ctx.globalAlpha = fade;
      reveal('一 生 万 物', CX, CY + 190, { family: 'SansSC', weight: 300, size: 30, ls: 22, color: INK }, 61.0, null, t, .08);
      fadeText('FROM ONE, EVERYTHING.', CX, CY + 240, { family: 'Inter', weight: 500, size: 13, ls: 9, color: MUTE }, 61.6, null, t);
      ctx.restore();
    }
    const ping = Math.exp(-(t - 60) * 6);
    const end = inBack(prog(t, 64.9, 65.6), 2.2);
    const cy = lerp(base - 64 * 1.0 - 0, CY, 0);
    // O 的垂直中心对齐大写字母的中线
    const oy = lerp(base - 176 * .727 / 2, CY, home);
    circle(lx, oy, Rl * (1 + .08 * ping) * lerp(1, .3, home) * (1 - end), RED);
    if (t < 61.5) {
      const k = prog(t, 60, 61.5);
      ctx.save(); ctx.globalAlpha = (1 - k) * .4; ring(lx, oy, Rl + 300 * outExpo(k), INK, 1.4); ctx.restore();
    }
  }
}

// =====================================================================
function render(t) {
  ctx.save();
  if (t < 8) s1(t);
  else if (t < 16) s2(t);
  else if (t < 24) s3(t);
  else if (t < 32) s4(t);
  else if (t < 48) s5(t);
  else if (t < 56) s6(t);
  else s7(t);
  ctx.restore();
  hud(t);
}
window.render = render;
window.ready = (async () => {
  const specs = ['700 20px SerifSC', '100 20px SansSC', '300 20px SansSC', '400 20px SansSC', '500 20px SansSC', '900 20px SansSC',
    '500 20px Inter', '600 20px Inter', '700 20px Inter', '900 20px InterDisplay'];
  await Promise.all(specs.map(s => document.fonts.load(s, '道生一二三万物归大至简形律衡空色动ONE')));
  await document.fonts.ready;
  render(0);
  return true;
})();
</script>
</body>
